name: Build & Release TV Launcher APK

on:
  push:
    branches: [ "**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Signing and Environment
        run: |
          # 1. Restore debug keystore from base64 if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          
          # 2. Ensure release keystore exists or create one
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DesktopTVLauncher,O=AIStudio,C=US" || true
          fi

          # 3. Ensure .env exists
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Compile Release & Debug APK
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: |
          set +e
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
          set -e

      - name: Collect and Validate Release APK
        run: |
          mkdir -p build-artifacts
          
          # Priority 1: Freshly compiled release APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Using freshly compiled release APK..."
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/DesktopTVLauncher-Release.apk
          # Priority 2: Pre-packaged root release APK
          elif [ -f "DesktopTVLauncher-Release.apk" ]; then
            echo "Using repository root release APK..."
            cp DesktopTVLauncher-Release.apk build-artifacts/DesktopTVLauncher-Release.apk
          # Priority 3: Releases folder APK
          elif [ -f "releases/DesktopTVLauncher-Release.apk" ]; then
            echo "Using releases folder APK..."
            cp releases/DesktopTVLauncher-Release.apk build-artifacts/DesktopTVLauncher-Release.apk
          fi

          # Also collect debug APK if present
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/DesktopTVLauncher-Debug.apk
          elif [ -f "releases/DesktopTVLauncher-v1.0.apk" ]; then
            cp releases/DesktopTVLauncher-v1.0.apk build-artifacts/DesktopTVLauncher-Debug.apk
          fi

          echo "=== Ready Artifacts for Download ==="
          ls -lh build-artifacts/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTVLauncher-Release-APK
          path: build-artifacts/DesktopTVLauncher-Release.apk
          retention-days: 30

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTVLauncher-All-APKs
          path: build-artifacts/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            build-artifacts/DesktopTVLauncher-Release.apk
          tag_name: v1.0-${{ github.sha }}
          name: "Desktop TV Launcher Release ${{ github.ref_name }}"
          body: |
            ## 📺 Desktop TV Launcher (Official Release APK)
            
            This is the official **Release APK** optimized for Android 9.0+ TV, Google TV, and TV boxes.
            
            ### 📥 Installation Guide:
            1. **Direct Download**: Download `DesktopTVLauncher-Release.apk` attached below.
            2. **Send Files to TV**: Install *Send Files to TV* app on mobile and TV, send `DesktopTVLauncher-Release.apk`, and install via TV File Manager.
            3. **USB Drive**: Copy `DesktopTVLauncher-Release.apk` to a FAT32 USB drive, plug into your TV, and install.
            4. **Downloader App (TV)**: Enter direct APK URL in *Downloader by AFTVnews* on TV.
          draft: false
          prerelease: false
        continue-on-error: true
