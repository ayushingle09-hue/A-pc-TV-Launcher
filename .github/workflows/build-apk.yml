name: Build & Release TV Launcher APK

on:
  push:
    branches: [ "**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Signing Keystore & Environment
        run: |
          # 1. Restore debug.keystore from debug.keystore.base64
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore restored successfully."
          else
            echo "debug.keystore.base64 not found."
          fi

          # 2. Ensure .env exists so Secrets Gradle Plugin doesn't fail
          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK Package
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/DesktopTVLauncher-v1.0.apk
          elif [ -f "releases/DesktopTVLauncher-v1.0.apk" ]; then
            cp releases/DesktopTVLauncher-v1.0.apk build-artifacts/DesktopTVLauncher-v1.0.apk
          fi
          echo "Output Artifact:"
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTVLauncher-Debug-APK
          path: build-artifacts/DesktopTVLauncher-v1.0.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/DesktopTVLauncher-v1.0.apk
          name: "Desktop TV Launcher ${{ github.ref_name }}"
          body: |
            ## Desktop TV Launcher - Android TV Release
            
            This debug build is ready to install on your Android TV, Google TV, Fire TV, or TV Box!
            
            ### Installation Methods:
            1. **Send Files to TV**: Send `DesktopTVLauncher-v1.0.apk` from phone to TV and install using a TV File Manager.
            2. **USB Flash Drive**: Copy `DesktopTVLauncher-v1.0.apk` to a USB drive, plug into TV, and open in TV File Manager.
            3. **Downloader App on TV**: Download directly via Downloader by AFTVnews on TV.
            4. **ADB Command**: `adb install -r DesktopTVLauncher-v1.0.apk`
          draft: false
          prerelease: false
